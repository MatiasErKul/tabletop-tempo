<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- CLAP: two open hands tilted toward each other, fingertips meeting, with impact lines. Original artwork, MIT. -->
  <g fill="white" stroke="white">
    <!-- left hand (thumb outward) -->
    <g transform="translate(35 64) rotate(24)">
      <rect x="-11" y="-8" width="22" height="27" rx="8" stroke-width="0"/>
      <line x1="-8" y1="-6" x2="-8.5" y2="-24" stroke-width="5.5"/>
      <line x1="-2.7" y1="-6" x2="-2.7" y2="-30" stroke-width="5.5"/>
      <line x1="2.7" y1="-6" x2="2.9" y2="-28" stroke-width="5.5"/>
      <line x1="8" y1="-6" x2="8.6" y2="-21" stroke-width="5.5"/>
      <line x1="-9" y1="9" x2="-21" y2="-3" stroke-width="6.5"/>
    </g>
    <!-- right hand (mirror) -->
    <g transform="translate(65 64) rotate(-24)">
      <rect x="-11" y="-8" width="22" height="27" rx="8" stroke-width="0"/>
      <line x1="8" y1="-6" x2="8.5" y2="-24" stroke-width="5.5"/>
      <line x1="2.7" y1="-6" x2="2.7" y2="-30" stroke-width="5.5"/>
      <line x1="-2.7" y1="-6" x2="-2.9" y2="-28" stroke-width="5.5"/>
      <line x1="-8" y1="-6" x2="-8.6" y2="-21" stroke-width="5.5"/>
      <line x1="9" y1="9" x2="21" y2="-3" stroke-width="6.5"/>
    </g>
    <!-- impact lines -->
    <line x1="50" y1="17" x2="50" y2="8" stroke-width="4.5"/>
    <line x1="40" y1="20" x2="34" y2="13" stroke-width="4.5"/>
    <line x1="60" y1="20" x2="66" y2="13" stroke-width="4.5"/>
  </g>
</svg>
